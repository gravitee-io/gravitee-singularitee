// Singularitee pipeline discovery protocol.
//
// Read-only catalogue of published pipelines: id, name, task, visibility and
// input modalities. The DAG itself (steps, edges, step configs) is a
// server-internal Java model built from the workspace YAML by the step plugins'
// codecs and never crosses the wire.

syntax = "proto3";

package io.gravitee.singularitee.protocol;

import "io/gravitee/singularitee/protocol/inference.proto";

option java_package = "io.gravitee.singularitee.protocol";
option java_outer_classname = "PipelineProto";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service GraviteePipelineService {
  rpc GetPipeline      (GetPipelineRequest)      returns (GetPipelineResponse);
  rpc ListPipelines    (ListPipelinesRequest)    returns (ListPipelinesResponse);
}

// ---------------------------------------------------------------------------
// Pipeline status
// ---------------------------------------------------------------------------

enum PipelineStatus {
  PIPELINE_STATUS_UNSPECIFIED = 0;
  // All referenced models are active and the pipeline accepts requests.
  PIPELINE_STATUS_ACTIVE      = 1;
  // Pipeline definition is invalid or an unrecoverable error occurred.
  PIPELINE_STATUS_ERROR       = 4;
}

// ---------------------------------------------------------------------------
// Pipeline definition
// ---------------------------------------------------------------------------

// Discovery metadata for a published pipeline. The pipeline's DAG (steps, edges,
// step configs) is an internal Java model built from the workspace YAML and never
// crosses the wire: step definitions left the protocol when pipeline publication
// over gRPC was removed.
message Pipeline {
  // Stable identifier; always populated on GetPipeline responses.
  string pipeline_id   = 1;
  // Human-readable name.
  string pipeline_name = 2;
  // 3, 4, 5 retired: entry_step_id, steps, edges (the DAG is server-internal).
  reserved 3, 4, 5;
  reserved "entry_step_id", "steps", "edges";
  // 6 retired: stream_intermediate_steps.
  reserved 6; reserved "stream_intermediate_steps";
  // Task slug describing the API surface this pipeline exposes, in the same
  // vocabulary as GetModelResponse.task ("text-generation", "text-classification",
  // "token-classification", "feature-extraction", "reranking").
  //
  // Declared in the workspace as `task:`; when omitted the server derives it from
  // the model behind the pipeline's output step. A pipeline is never advertised as
  // a "pipeline": callers route on the task, not on how the answer is produced.
  string task          = 7;
  // Whether this pipeline is kept out of the public catalogue. Hidden pipelines
  // (workspace `visible: false`) are omitted from ListPipelines and rejected on
  // the OpenAI HTTP surface; they remain callable as sub-pipelines and over gRPC.
  //
  // Stated negatively so that proto3's false default means "published": a
  // pipeline built in code, without a workspace, is listed like any other.
  bool hidden          = 8;
  // What this pipeline accepts as input, in the same vocabulary as
  // GetModelResponse.input_modalities. Declared in the workspace as `modalities:`;
  // otherwise derived at registration from the model behind the output step, since
  // that is the model any attached media has to be decoded by.
  //
  // Empty is read as text-only.
  repeated string input_modalities = 9;
}

// ---------------------------------------------------------------------------
// Pipeline CRUD messages
// ---------------------------------------------------------------------------

message GetPipelineRequest      { string pipeline_id   = 1; }
message GetPipelineResponse     { Pipeline pipeline    = 1; PipelineStatus status = 2; }

message ListPipelinesRequest    {}
message ListPipelinesResponse   { repeated GetPipelineResponse pipelines = 1; }
