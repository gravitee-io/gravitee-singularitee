#
# Isolated workspace — pii-ner only (GLiNER2 Pii-Multi, onnx_fp16 variant).
# Single-model target for the corpus-driven perf runs (pii-corpus-load-test.js).
#
#   GRAVITEE_AI_WORKSPACE_PATH=/path/to/workspace-pii-ner.yaml
#   GRAVITEE_HTTP_ENABLED=true GRAVITEE_HTTP_PORT=8090
#

workspace:
  name: pii-ner-fp16

  models:
    # GLiNER2 Pii-Multi — full 42-type schema. Lower threshold favours recall.
    - id: pii-ner
      type: gliner_ner
      name: gravitee-io/gliner4j-gliner2-privacy-filter-PII-multi
      memory_check: disabled
      gliner_ner:
        variant: onnx_fp16
        threshold: 0.4
        token_cap: 512
        entities:
          - name: person
            description: Full name of a real individual
          - name: full_name
            description: Complete name written as a single string
          - name: first_name
            description: Given / first name
          - name: middle_name
            description: Middle name or initial
          - name: last_name
            description: Family name / surname
          - name: date_of_birth
            description: A person's date of birth
          - name: email
            description: Email address
          - name: phone_number
            description: Phone or mobile number
          - name: address
            description: Full postal address
          - name: street_address
            description: Street name and number
          - name: city
            description: City or town name
          - name: state_or_region
            description: State, province, or region
          - name: postal_code
            description: ZIP or postal code
          - name: country
            description: Country name
          - name: government_id
            description: Generic government-issued identifier
          - name: national_id_number
            description: National identity number (SSN-equivalent)
          - name: passport_number
            description: Passport number
          - name: drivers_license_number
            description: Driver's license number
          - name: license_number
            description: Other professional or official license number
          - name: tax_id
            description: Tax identifier (TIN, VAT, EIN)
          - name: tax_number
            description: Tax filing or registration number
          - name: bank_account
            description: Bank account number or reference
          - name: account_number
            description: Generic account number
          - name: routing_number
            description: Bank routing number or sort code
          - name: iban
            description: International Bank Account Number
          - name: payment_card
            description: Payment card reference
          - name: card_number
            description: Credit or debit card number
          - name: card_expiry
            description: Card expiration date
          - name: card_cvv
            description: Card CVV / CVC security code
          - name: username
            description: Online username, handle, or login
          - name: ip_address
            description: IPv4 or IPv6 address
          - name: account_id
            description: Account identifier
          - name: sensitive_account_id
            description: Sensitive or privileged account identifier
          - name: password
            description: Password value
          - name: secret
            description: Generic secret value
          - name: api_key
            description: API key or token in any free-form format
          - name: access_token
            description: Access token or bearer credential
          - name: recovery_code
            description: Recovery, backup, or one-time code
          - name: sensitive_date
            description: A sensitive date tied to a person or event
          - name: document_date
            description: Date associated with a document
          - name: expiration_date
            description: Generic expiration date
          - name: transaction_date
            description: Date of a financial transaction
