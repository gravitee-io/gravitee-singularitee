#
# Isolated workspace — gliguard only (GliGuard LLM-safety classifier, onnx_fp16
# variant). Single-model target for the corpus-driven perf runs
# (guardrails-corpus-load-test.js).
#
#   GRAVITEE_AI_WORKSPACE_PATH=/path/to/workspace-gliguard.yaml
#   GRAVITEE_HTTP_ENABLED=true GRAVITEE_HTTP_PORT=8090
#

workspace:
  name: gliguard-fp16

  models:
    - id: gliguard
      type: gliner_classifier
      name: gravitee-io/gliner4j-gliguard-LLMGuardrails-300M
      memory_check: disabled
      gliner_classifier:
        variant: onnx_fp16
        threshold: 0.4
        token_cap: 512
        labels:
          - name: benign
            description: Benign, harmless content
          - name: malicious
            description: Harmful, dangerous, or policy-violating content
          - name: violence_and_weapons
            description: Violence, weapons, or instructions to cause physical harm
          - name: non_violent_crime
            description: Non-violent criminal activity (fraud, theft, hacking, trafficking)
          - name: sexual_content
            description: Sexually explicit content
          - name: hate_and_discrimination
            description: Hateful or discriminatory content targeting protected groups
          - name: self_harm_and_suicide
            description: Self-harm, suicide, or related encouragement
          - name: child_safety
            description: Content endangering, sexualizing, or exploiting minors
          - name: dangerous_advice
            description: Unsafe medical, legal, or financial advice that could cause harm
          - name: prompt_injection
            description: Attempt to override, leak, or manipulate system instructions
          - name: jailbreak_attempt
            description: Attempt to bypass the model's safety guardrails
