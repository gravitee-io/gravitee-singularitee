# GLiNER entity extraction on ONNX Runtime.
workspace:
  name: e2e-spans-gliner-onnx

  includes:
    pipelines:
      - redact.yaml

  models:
    - id: pii
      name: gravitee-io/gliner4j-gliner2-privacy-filter-PII-multi
      type: gliner_ner
      memory_check: disabled
      gliner_ner:
        variant: onnx_fp16
        threshold: 0.4
        entities:
          - name: email
            description: Email address
