# Local observability stack for Singularitee.
#
#   docker compose -f examples/observability/docker-compose.yml up -d
#
# Then open Grafana at http://localhost:3000 (admin / admin) — the
# "Singularitee — GPU & Inference" dashboard is provisioned automatically
# and wired to the bundled Prometheus, which scrapes the server on the host at
# :18092 (see prometheus/prometheus.yml).
#
# Prerequisites on the server side (config/gravitee.yml):
#   services.metrics.enabled: true
#   services.metrics.prometheus.enabled: true
#   services.monitoring.gpu.enabled: true   # for the gpu_* panels
services:
  # Host networking so both containers reach the server over loopback
  # (localhost:18092). On Linux this sidesteps the host firewall dropping
  # container→host bridge traffic. Prometheus serves its UI on :9090, Grafana
  # on :3000, directly on the host.
  # Docker Desktop (macOS/Windows): host networking is limited — instead drop
  # `network_mode: host`, add `ports:` mappings and `extra_hosts:
  # ["host.docker.internal:host-gateway"]`, and set the Prometheus target /
  # Grafana datasource url to host.docker.internal.
  prometheus:
    image: prom/prometheus:latest
    container_name: gravitee-ai-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: gravitee-ai-grafana
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
