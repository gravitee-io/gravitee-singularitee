# Prometheus scrape config for Singularitee.
#
# The server exposes Micrometer metrics in Prometheus format on the internal
# management ("core") HTTP port (default 18092), behind basic auth.
#   endpoint : http://<host>:18092/_node/metrics/prometheus
#   auth     : services.core.http.authentication (default admin/adminadmin)
#
# Metrics of interest:
#   gpu_utilization_percent, gpu_memory_utilization_percent,
#   gpu_memory_total_bytes, gpu_memory_used_bytes,
#   gpu_temperature_celsius, gpu_power_watts        (tags: gpu, name, uuid)
#   ai_infer_requests_total, ai_infer_latency_seconds, ai_model_call_seconds,
#   ai_tokens_total, ai_pipeline_requests_total, ...
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gravitee-singularitee
    metrics_path: /_node/metrics/prometheus
    basic_auth:
      username: admin
      password: adminadmin
    static_configs:
      # Prometheus runs with host networking (see docker-compose.yml), so each
      # server instance's management port is reachable over loopback. One entry
      # per running instance — the `instance` label distinguishes them in Grafana.
      - targets: ["localhost:18092"]
        labels:
          instance: semantic-router     # ONNX/GLiNER (classify) — ai_classify_*
      - targets: ["localhost:18093"]
        labels:
          instance: qwen3               # llama.cpp LLM (pipelines) — ai_pipeline_*, ai_tokens_*
