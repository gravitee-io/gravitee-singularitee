# Jaeger (Apache-2.0): an OTLP trace viewer for Singularitee spans. It ingests the same OTLP
# we export and shows the full trace tree with every attribute (openinference.span.kind, llm.*,
# singularitee.*, input.value/output.value) as span tags.
#
#   docker compose -f examples/observability/jaeger/docker-compose.yml up -d
#   # UI        http://localhost:16686
#   # OTLP gRPC localhost:4317   (Singularitee's default exporter endpoint)
#
# Then start the server with tracing on (config-only; endpoint/protocol already default to
# localhost:4317 / grpc):
#
#   GRAVITEE_SERVICES_OPENTELEMETRY_ENABLED=true GRAVITEE_SERVICES_OPENTELEMETRY_VERBOSE=true \
#     ./run-server.sh --workspace <a workspace>
services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: singularitee-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # web UI
      - "4317:4317" # OTLP over gRPC, matches services.opentelemetry.exporter.endpoint
      - "4318:4318" # OTLP over HTTP/protobuf
