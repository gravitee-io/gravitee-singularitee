# PII detection · bert-small token classifier (ONNX)
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/classifier/pii-bert.yaml
#
# A FINE-TUNED (not zero-shot) token classifier: it emits BIO token labels that
# the engine aggregates into "PII" spans. Fast and cheap on CPU, but it only
# detects what it was trained on — compare with pii-gliner.yaml, which takes its
# entity list at inference time.
#
# Classify over HTTP:
#   curl localhost:8080/v1/classify -H 'content-type: application/json' \
#     -d '{"model":"pii","input":"Call me on 06 12 34 56 78, John Doe"}'
#
# Used as the "pii" guard model by examples/pipelines/guard.yaml.

workspace:
  name: pii-bert

  models:
    - id: pii
      name: gravitee-io/bert-small-pii-detection
      type: onnx_classifier
      memory_check: disabled
      onnx_classifier:
        model_path: model.onnx
        tokenizer_path: tokenizer.json
        config_json_path: config.json
        max_sequence_length: 512
        classifier_mode: TOKEN
