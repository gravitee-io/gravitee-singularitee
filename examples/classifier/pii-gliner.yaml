# PII detection · GLiNER2 zero-shot, 42 entity types
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/classifier/pii-gliner.yaml
#
# ZERO-SHOT counterpart to pii-bert.yaml: the entity list below is supplied to the
# model at inference time, so narrowing detection is a matter of DELETING lines —
# no retraining, no new model. The trade-off is cost: a zero-shot pass is heavier
# than the fine-tuned bert, and the schema is re-embedded per distinct label set.
#
# Classify over HTTP:
#   curl localhost:8080/v1/classify -H 'content-type: application/json' \
#     -d '{"model":"pii","input":"my IBAN is FR76 3000 6000 0112 3456 7890 189"}'

workspace:
  name: pii-gliner

  models:
    - id: pii
      name: gravitee-io/gliner4j-gliner2-privacy-filter-PII-multi
      type: gliner_ner
      memory_check: disabled
      gliner_ner:
        variant: onnx_fp16
        threshold: 0.4
        # The full 42-type PII schema the model was trained on. Trim this list to
        # narrow what is detected — that is the entire tuning surface.
        entities:
          - name: person
            description: Full name of a real individual
          - name: full_name
            description: Complete name as a single string
          - name: first_name
            description: Given name
          - name: middle_name
            description: Middle name or initial
          - name: last_name
            description: Family name / surname
          - name: date_of_birth
            description: Date of birth
          - name: email
            description: Email address
          - name: phone_number
            description: Phone or mobile number
          - name: address
            description: Full postal address
          - name: street_address
            description: Street and number
          - name: city
            description: City name
          - name: state_or_region
            description: State, province, or region
          - name: postal_code
            description: ZIP or postal code
          - name: country
            description: Country name
          - name: government_id
            description: Generic government-issued identifier
          - name: national_id_number
            description: National ID / SSN-like number
          - name: passport_number
            description: Passport number
          - name: drivers_license_number
            description: Driver's license number
          - name: license_number
            description: Other professional license number
          - name: tax_id
            description: Tax identifier (e.g. TIN, VAT)
          - name: tax_number
            description: Tax filing or registration number
          - name: bank_account
            description: Bank account number or reference
          - name: account_number
            description: Generic account number
          - name: routing_number
            description: Bank routing / sort code
          - name: iban
            description: IBAN
          - name: payment_card
            description: Payment card reference
          - name: card_number
            description: Credit / debit card number
          - name: card_expiry
            description: Card expiration date
          - name: card_cvv
            description: Card CVV / CVC
          - name: username
            description: Online username or handle
          - name: ip_address
            description: IPv4 / IPv6 address
          - name: account_id
            description: Account identifier
          - name: sensitive_account_id
            description: Sensitive account identifier
          - name: password
            description: Password value
          - name: secret
            description: Generic secret value
          - name: api_key
            description: API key
          - name: access_token
            description: Access token or bearer credential
          - name: recovery_code
            description: Recovery or backup code
          - name: sensitive_date
            description: Sensitive date
          - name: document_date
            description: Date associated with a document
          - name: expiration_date
            description: Generic expiration date
          - name: transaction_date
            description: Date of a financial transaction
