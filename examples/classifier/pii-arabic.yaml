# Arabic PII detection · OpenMed BigMed-Large 560M token classifier (ONNX)
#
# Standalone workspace. Run it with:
#   ./run-server.sh --workspace examples/classifier/pii-arabic.yaml
#
# A fine-tuned token classifier (large encoder, ~560M parameters) that emits BIO labels
# aggregated into PII spans. Much heavier than pii-bert.yaml, so expect it to be slow on a
# laptop CPU. The repository is private to gravitee-io, so set HF_TOKEN (a token with read
# access) before the first boot.
#
# The repository ships three exports under onnx/. This workspace runs the uint8 one (1.3 GB,
# the fastest on CPU) and excludes the rest so only that file is downloaded:
#   model_uint8.onnx          1.3 GB  quantised, CPU
#   model_fp16.onnx           1.1 GB  half precision, for a GPU (-Pcuda build)
#   model.onnx + .onnx_data   2.2 GB  full precision, the accuracy reference
# To switch, change model_path and exclude the other two exports instead.
#
# Classify over HTTP:
#   curl localhost:8080/v1/classify -H 'content-type: application/json' \
#     -d '{"model":"pii","input":"اسمي أحمد محمد، رقم هاتفي 0501234567"}'

workspace:
  name: pii-arabic

  models:
    - id: pii
      name: gravitee-io/OpenMed-PII-Arabic-BigMed-Large-560M-v1-onnx
      type: onnx_classifier
      memory_check: disabled
      download:
        exclude:
          - "onnx/model.onnx"
          - "onnx/model.onnx_data"
          - "onnx/model_fp16.onnx"
      onnx_classifier:
        model_path: onnx/model_uint8.onnx
        tokenizer_path: tokenizer.json
        config_json_path: config.json
        max_sequence_length: 512
        classifier_mode: TOKEN
