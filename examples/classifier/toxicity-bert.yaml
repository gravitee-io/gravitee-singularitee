# Toxicity detection · distilbert multilingual (ONNX)
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/classifier/toxicity-bert.yaml
#
# SEQUENCE-level classifier (the whole input gets one label) returning
# {non-toxic, toxic} — contrast with pii-bert.yaml, which is TOKEN-level and
# labels individual spans. Multilingual, fine-tuned, CPU-friendly.
#
# Classify over HTTP:
#   curl localhost:8080/v1/classify -H 'content-type: application/json' \
#     -d '{"model":"toxicity","input":"you are worthless"}'
#
# Used as the "toxicity" guard model by examples/pipelines/guard.yaml.

workspace:
  name: toxicity-bert

  models:
    - id: toxicity
      name: gravitee-io/distilbert-multilingual-toxicity-classifier
      type: onnx_classifier
      memory_check: disabled
      onnx_classifier:
        model_path: model.quant.onnx
        tokenizer_path: tokenizer.json
        config_json_path: config.json
        labels:
          - non-toxic
          - toxic
        max_sequence_length: 512
        classifier_mode: SEQUENCE
