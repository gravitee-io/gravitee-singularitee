# Generation model — Mistral-7B-Instruct-v0.3 (llama.cpp / GGUF)
#
# Logical id: "llm" — a larger, higher-quality llama.cpp alternative to the
# default Qwen3-0.6B. Swap it into server-llamacpp.yaml by replacing the
# include "llama/llm-qwen3-0.6b.yaml" with "llama/llm-mistral-7b.yaml". Because it
# also declares id "llm", load EXACTLY ONE "llm-*" model file per server.
#
# Served by: server-llamacpp.yaml (:9090) — swap-in

workspace:
  models:
    - id: llm
      name: bartowski/Mistral-7B-Instruct-v0.3-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Mistral-7B-Instruct-v0.3-Q8_0.gguf
        n_ctx: 4096
        n_batch: 4096
        n_ubatch: 4096
        n_seq_max: 4
        n_gpu_layers: 999
        flash_attn_type: AUTO
