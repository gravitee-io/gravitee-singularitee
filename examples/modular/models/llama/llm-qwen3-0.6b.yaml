# Generation model — Qwen3-0.6B (llama.cpp / GGUF)
#
# Logical id: "llm". Every generation pipeline (infer, tool-calling, pii-redact,
# toxicity-guard) references the model under the stable id "llm", so the SAME
# pipeline runs unchanged whatever backend a server binds to that id. This file
# binds "llm" to the small cross-platform llama.cpp model — the default,
# runs on macOS/Metal and CPU with no extra runtime.
#
# Served by: server-llamacpp.yaml (:9090)

workspace:
  models:
    - id: llm
      name: Qwen/Qwen3-0.6B-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Qwen3-0.6B-Q8_0.gguf
        n_seq_max: 4
        n_gpu_layers: 999
        flash_attn_type: AUTO
