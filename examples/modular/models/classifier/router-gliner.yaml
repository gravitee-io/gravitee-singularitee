# Router — GLiNER zero-shot intent classifier (ONNX)
#
# Logical id: "router". A zero-shot classifier: the routing labels (with their
# descriptions) are supplied here, no fine-tuning required. The route pipeline
# step classifies the prompt against these labels and branches accordingly.
# Cross-platform (ONNX Runtime, CPU) — co-located with the other classifiers on
# the safety server.
#
# Served by: server-safety.yaml (:9092)

workspace:
  models:
    - id: router
      name: gravitee-io/gliner4j-gliner2-base-v1
      type: gliner_classifier
      memory_check: disabled
      gliner_classifier:
        variant: onnx_fp16
        threshold: 0.3
        labels:
          - name: software development question
            description: >
              User asks about writing, fixing, or understanding code; debugging; algorithms;
              data structures; system design; APIs; programming languages, tools, or frameworks.
          - name: cooking and food recipe
            description: >
              User asks how to prepare food or drinks; requests recipes, cooking steps,
              ingredient lists, substitutions, measurements, or kitchen techniques.
          - name: financial advice
            description: >
              User asks how to manage or grow money; investing, budgeting, saving, debt,
              taxes, retirement, or choosing financial products.
          - name: general conversation
            description: >
              User engages in casual or non-specialized interaction; small talk, opinions,
              jokes, brainstorming, or queries without a clear technical, culinary, or financial intent.
