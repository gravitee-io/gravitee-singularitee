# Toxicity classifier — distilbert multilingual toxicity (ONNX)
#
# Logical id: "toxicity". Sequence-level classifier returning {non-toxic, toxic};
# the guard step rejects inputs scoring "toxic" above the trigger threshold.
# Cross-platform (ONNX Runtime, CPU) — pairs with any LLM backend.
#
# Served by: server-safety.yaml (:9092)

workspace:
  models:
    - id: toxicity
      name: gravitee-io/distilbert-multilingual-toxicity-classifier
      type: onnx_classifier
      memory_check: disabled
      onnx_classifier:
        model_path: model.quant.onnx
        tokenizer_path: tokenizer.json
        config_json_path: config.json
        labels:
          - non-toxic
          - toxic
        max_sequence_length: 512
        classifier_mode: SEQUENCE
