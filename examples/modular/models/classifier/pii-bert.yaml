# PII detector — bert-small PII token classifier (ONNX)
#
# Logical id: "pii". Token-level (NER-style) classifier; the guard step redacts
# detected spans. Cross-platform (ONNX Runtime, CPU) — pairs with any LLM
# backend. This is the DEFAULT pii backend on server-safety.yaml because its
# HuggingFace bundle is published and loads out of the box.
#
# Served by: server-safety.yaml (:9092)

workspace:
  models:
    - id: pii
      name: gravitee-io/bert-small-pii-detection
      type: onnx_classifier
      memory_check: disabled
      onnx_classifier:
        model_path: model.onnx
        tokenizer_path: tokenizer.json
        config_json_path: config.json
        max_sequence_length: 512
        classifier_mode: TOKEN
