# Generation model — Qwen3-0.6B GPTQ-Int8 (vLLM / vllm4j)
#
# Logical id: "llm". 8-bit GPTQ quantization, ~2x memory reduction vs bfloat16.
# Linux/CUDA only — requires the vLLM virtualenv: -Dvllm4j.venv=/path/to/.venv
#
# Served by: server-vllm-gptq.yaml (:9091)

workspace:
  models:
    - id: llm
      name: Qwen/Qwen3-0.6B-GPTQ-Int8
      type: vllm
      memory_check: warn
      vllm:
        dtype: float16
        quantization: gptq
        max_model_len: 4096
        max_num_seqs: 4
        gpu_memory_utilization: 0.35
        enforce_eager: false
        trust_remote_code: true
        enable_prefix_caching: true
        enable_sleep_mode: false
