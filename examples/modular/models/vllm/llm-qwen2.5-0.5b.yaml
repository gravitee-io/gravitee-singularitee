# Generation model — Qwen2.5-0.5B (vLLM / vllm4j)
#
# Logical id: "llm". Dense 0.5B, bf16, 32k context. Predates thinking mode.
#
# Linux/CUDA only — needs the vLLM virtualenv (-Dvllm4j.venv=/path/to/.venv)
# unless you run the -vllm-cuda image, which bundles it.
#
# Swap-in for server-vllm-gptq.yaml / server-vllm-awq.yaml: replace the included
# "vllm/llm-*.yaml" with this file. Every one of these declares id "llm", so load
# EXACTLY ONE "llm-*" model file per server.

workspace:
  models:
    - id: llm
      name: Qwen/Qwen2.5-0.5B-Instruct
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        max_model_len: 32768
        max_num_seqs: 16
        gpu_memory_utilization: 0.45
        enforce_eager: false
        enable_prefix_caching: true
