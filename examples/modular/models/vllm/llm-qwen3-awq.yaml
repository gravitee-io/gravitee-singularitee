# Generation model — Qwen3-4B AWQ 4-bit (vLLM / vllm4j)
#
# Logical id: "llm". 4-bit AWQ quantization, ~4x memory reduction vs bfloat16,
# 10-20% faster than GPTQ at the same bit-width. Linux/CUDA only — requires the
# vLLM virtualenv: -Dvllm4j.venv=/path/to/.venv
#
# Served by: server-vllm-awq.yaml (:9093)

workspace:
  models:
    - id: llm
      name: Qwen/Qwen3-4B-AWQ
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        quantization: awq
        max_model_len: 4096
        max_num_seqs: 8
        gpu_memory_utilization: 0.35
        enforce_eager: false
        trust_remote_code: true
        enable_prefix_caching: true
        enable_sleep_mode: false
