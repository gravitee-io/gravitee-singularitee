# ─────────────────────────────────────────────────────────────────────────────
# Client — single server (llama.cpp, :9090)
# ─────────────────────────────────────────────────────────────────────────────
#
# Runs the pipelines locally and proxies the "llm" model to the llama.cpp server.
# Loads the tool-system template so the tool-calling pipeline can render it.
#
# Prerequisite: server-llamacpp.yaml running on :9090.
#
# Launch:
#   java io.gravitee.singularitee.cli.Main \
#        --workspace examples/modular/client-llamacpp.yaml --pipeline-id infer-pipeline
#   (or --pipeline-id tool-calling)

workspace:
  name: client-llamacpp

  remote:
    default:
      host: 127.0.0.1
      port: 9090

  models:
    - id: llm
      type: remote_llm

  includes:
    templates:
      - tool-system.yaml
    pipelines:
      - infer.yaml
      - tool-calling.yaml
