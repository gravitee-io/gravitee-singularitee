# ─────────────────────────────────────────────────────────────────────────────
# Server — vLLM AWQ generation backend (:9093)
# ─────────────────────────────────────────────────────────────────────────────
#
# Hosts ONE generation model under logical id "llm" (Qwen3-0.6B AWQ 4-bit) plus
# the plain infer pipeline. Linux/CUDA only — requires the vLLM virtualenv.
# Runs on a different port from the GPTQ server (:9091) so both can run at once.
#
# Launch (port via -Dgrpc.port; vLLM venv via -Dvllm4j.venv):
#   java -Dgrpc.port=9093 -Dvllm4j.venv=~/.venv-gravitee-ai/.venv \
#        -Dai.workspace.path=examples/modular/server-vllm-awq.yaml \
#        io.gravitee.singularitee.standalone.SingulariteeContainer

workspace:
  name: server-vllm-awq

  includes:
    models:
      - vllm/llm-qwen3-awq.yaml
    pipelines:
      - infer.yaml
