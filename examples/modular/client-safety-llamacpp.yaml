# ─────────────────────────────────────────────────────────────────────────────
# Client — MULTI-SERVER (safety :9092  +  llama.cpp :9090)
# ─────────────────────────────────────────────────────────────────────────────
#
# One client, two servers. The pipeline DAG runs locally; each model call is
# routed over gRPC to the server that hosts it:
#   - "pii" / "toxicity" classifiers ──→ safety   server (:9092)
#   - "llm" generation               ──→ llamacpp server (:9090)
#
#   pii-redact:     pii_guard @safety ──→ generate @llamacpp
#   toxicity-guard: toxicity_guard @safety ──→ generate @llamacpp
#
#       ┌──────────────── CLIENT (runs the DAG) ────────────────┐
#       │   pii_guard ──gRPC──→ :9092      generate ──gRPC──→ :9090 │
#       └────────────────────────────────────────────────────────┘
#
# Prerequisites: server-safety.yaml on :9092 AND server-llamacpp.yaml on :9090.
#
# Launch:
#   java io.gravitee.singularitee.cli.Main \
#        --workspace examples/modular/client-safety-llamacpp.yaml \
#        --pipeline pii-redact-pipeline
#   (or --pipeline toxicity-guard-pipeline)

workspace:
  name: client-safety-llamacpp

  remote:
    servers:
      - id: safety
        host: 127.0.0.1
        port: 9092
      - id: llamacpp
        host: 127.0.0.1
        port: 9090

  models:
    - id: pii
      type: remote_classifier
      server: safety

    - id: toxicity
      type: remote_classifier
      server: safety

    - id: llm
      type: remote_llm
      server: llamacpp

  includes:
    pipelines:
      - pii-redact.yaml
      - toxicity-guard.yaml
