# Pipeline — toxicity screening then generation.
#
#   toxicity_guard (reject) ──→ generate
#
# The "toxicity" classifier screens the user's prompt; toxic input is rejected
# before any generation happens, clean input proceeds to the "llm" model.
# References two logical model ids: "toxicity" and "llm". On a multi-server
# client these live on DIFFERENT servers (toxicity on the safety server, llm on
# an LLM server), stitched into one DAG on the client.

workspace:
  pipelines:
    - id: toxicity-guard-pipeline
      name: Toxicity Guard Pipeline
      entry: toxicity_guard

      steps:
        - id: toxicity_guard
          type: guard
          next_step: generate
          config:
            model_id: toxicity
            input_field: prompt
            action: reject
            trigger:
              label: toxic
              score: 0.75
            message: "Your request was blocked because toxic content was detected (label: {{toxicity_guard.label}}, confidence: {{toxicity_guard.score}})."

        - id: generate
          type: infer
          role: output
          config:
            model_id: llm
            output_field: generate.output
            prompt:
              messages:
                - role: user
                  content: "{{prompt}}"
            sampling:
              max_tokens: 512
