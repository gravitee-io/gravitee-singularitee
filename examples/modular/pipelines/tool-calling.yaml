# Pipeline — single-step tool-capable inference.
#
# Demonstrates the template mechanism: the prompt is rendered from the named
# template "tool-system" (templates/tool-system.yaml) rather than inline
# messages. Tools are supplied at runtime by the caller; the tags tell the
# executor how to detect tool-call spans in the model output.
#
# The workspace that runs this pipeline must also load templates/tool-system.yaml.

workspace:
  pipelines:
    - id: tool-calling
      name: Tool Calling Pipeline
      entry: agent

      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            tags:
              tool_open: "<tool_call>"
              tool_close: "</tool_call>"
            prompt:
              template_id: tool-system
