# ─────────────────────────────────────────────────────────────────────────────
# Client — MULTI-SERVER routing (safety :9092  +  llama.cpp :9090)
# ─────────────────────────────────────────────────────────────────────────────
#
# One client, two servers. The GLiNER intent classifier lives on the safety
# server; the persona generation branches run on the llama.cpp server:
#   - "router" classifier ──→ safety   server (:9092)
#   - "llm" generation     ──→ llamacpp server (:9090)
#
#   route @safety ──→ [ respond_code | respond_cooking | respond_finance | respond_general ] @llamacpp
#
# Point "llm" at :9091 / :9093 to route to a vLLM server instead.
#
# Prerequisites: server-safety.yaml on :9092 AND server-llamacpp.yaml on :9090.
#
# Launch:
#   java io.gravitee.singularitee.cli.Main \
#        --workspace examples/modular/client-routing.yaml \
#        --pipeline routing-pipeline

workspace:
  name: client-routing

  remote:
    servers:
      - id: safety
        host: 127.0.0.1
        port: 9092
      - id: llamacpp
        host: 127.0.0.1
        port: 9090

  models:
    - id: router
      type: remote_classifier
      server: safety

    - id: llm
      type: remote_llm
      server: llamacpp

  includes:
    pipelines:
      - routing.yaml
