# ─────────────────────────────────────────────────────────────────────────────
# Client — single server (vLLM GPTQ, :9091)
# ─────────────────────────────────────────────────────────────────────────────
#
# Runs the infer pipeline locally and proxies "llm" to the vLLM GPTQ server.
#
# Prerequisite: server-vllm-gptq.yaml running on :9091.
#
# Launch:
#   java io.gravitee.singularitee.cli.Main \
#        --workspace examples/modular/client-vllm-gptq.yaml --pipeline-id infer-pipeline

workspace:
  name: client-vllm-gptq

  remote:
    default:
      host: 127.0.0.1
      port: 9091

  models:
    - id: llm
      type: remote_llm

  includes:
    pipelines:
      - infer.yaml
