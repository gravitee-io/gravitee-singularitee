# ─────────────────────────────────────────────────────────────────────────────
# Server — llama.cpp generation backend (:9090)
# ─────────────────────────────────────────────────────────────────────────────
#
# Hosts ONE generation model under logical id "llm" (Qwen3-0.6B GGUF) plus the
# generation pipelines that only need "llm". Cross-platform: runs on macOS/Metal
# and CPU with no extra runtime.
#
# Swap the model: replace the "llama/llm-qwen3-0.6b.yaml" include with
# "llama/llm-mistral-7b.yaml" (both declare id "llm" — include exactly one).
#
# Launch (port via -Dgrpc.port):
#   java -Dgrpc.port=9090 -Dai.workspace.path=examples/modular/server-llamacpp.yaml \
#        io.gravitee.singularitee.standalone.SingulariteeContainer

workspace:
  name: server-llamacpp

  includes:
    models:
      - llama/llm-qwen3-0.6b.yaml
    templates:
      - tool-system.yaml
    pipelines:
      - infer.yaml
      - tool-calling.yaml
      - cot.yaml
      - reasoning.yaml
