# ─────────────────────────────────────────────────────────────────────────────
# Client — single server, chain-of-thought (llama.cpp, :9090)
# ─────────────────────────────────────────────────────────────────────────────
#
# Runs the chain-of-thought loop locally, proxying "llm" to the llama.cpp server.
# Point the remote at :9091 / :9093 to reason on a vLLM server instead.
#
# Prerequisite: server-llamacpp.yaml running on :9090.
#
# Launch:
#   java io.gravitee.singularitee.cli.Main \
#        --workspace examples/modular/client-cot.yaml --pipeline cot-pipeline

workspace:
  name: client-cot

  remote:
    default:
      host: 127.0.0.1
      port: 9090

  models:
    - id: llm
      type: remote_llm

  includes:
    pipelines:
      - cot.yaml
