# Pipeline — tool-call self-repair loop · gpt-oss-20b (Harmony)
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/pipelines/tool-repair.yaml
#
#   generate ──→ repair_gate ──→ think_gate ──→ done
#      ↑______________|_____________|
#      (repair_gate loops on a failed tool-call parse, max 3;
#       think_gate loops on all-thinking-no-answer, max 2)
#      └────────────────────────────────────→ fallback (either loop exhausted)
#
# The wiring runs on the Harmony dialect: the `tags:` blocks
# fold gpt-oss's chained channel headers into reasoning/tool markers (see
# examples/llama/gpt-oss-20b.yaml for the full rationale of every form), and
# `tool_extraction_template: harmony` parses the captured span. The repair
# gate reads `generate.tool_parse_failed`: a Harmony span that renders
# malformed JSON loops back with `generate.parse_error` as a corrective turn
# instead of leaking channel syntax into the client-visible answer, while a
# plain prose answer (no tool attempt) passes straight through.
#
# Exercise it over HTTP with tools declared (http.enabled must be on), e.g.:
#   curl -s localhost:8080/v1/chat/completions -H 'content-type: application/json' -d '{
#     "model": "agent",
#     "messages": [{"role": "user", "content": "Email bob@example.com that the build is green."}],
#     "tools": [{"type": "function", "function": {"name": "send_email",
#       "parameters": {"type": "object", "properties": {"to": {"type": "string"},
#       "body": {"type": "string"}}, "required": ["to"]}}}]
#   }' | jq

workspace:
  name: tool-repair

  models:
    - id: llm
      name: ggml-org/gpt-oss-20b-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: gpt-oss-20b-MXFP4.gguf
        n_ctx: 128000
        n_seq_max: 1
        n_gpu_layers: 99999
        flash_attn_type: ENABLED
        cache_type_k: q8_0
        cache_type_v: q8_0
        mtp: false
        eog_ramp_start: 0.75
        eog_ramp_max_bias: 100.0

  pipelines:
    - id: agent
      name: Tool-call self-repair pipeline (gpt-oss)
      entry: generate

      steps:
        # Attempt the tool call. The Harmony tags fold channel headers into
        # reasoning/tool spans; extraction outcome lands in
        # generate.tool_parse_ok / generate.parse_error.
        - id: generate
          type: infer
          role: output
          next_step: repair_gate
          config:
            model_id: llm
            output_field: generate.output
            context:
              # medium, not low: at low this model writes malformed JSON for
              # tool arguments often enough to break agent flows.
              reasoning_effort: medium
            tags:
              reasoning_repeatable: true
              reasoning_open:
                - "<|end|><|start|>assistant<|channel|>analysis<|message|>"
                - "<|end|><|start|>assistant<|channel|>commentary<|message|>"
                - "<|start|>assistant<|channel|>analysis<|message|>"
                - "<|start|>assistant<|channel|>commentary<|message|>"
                - "<|channel|>analysis<|message|>"
                - "<|channel|>commentary<|message|>"
              reasoning_close:
                - "<|end|><|start|>assistant<|channel|>final<|message|>"
                - "<|call|><|start|>assistant<|channel|>final<|message|>"
                - "<|channel|>final<|message|>"
                - "<|end|>"
              tool_open:
                - "<|end|><|start|>assistant<|channel|>commentary to=functions."
                - "<|end|><|start|>assistant<|channel|>analysis to=functions."
                - "<|end|><|start|>assistant<|channel|>final to=functions."
                - "<|call|><|start|>assistant<|channel|>commentary to=functions."
                - "<|end|><|start|>assistant to=functions."
                - "<|start|>assistant<|channel|>commentary to=functions."
                - "<|start|>assistant to=functions."
                - "<|channel|>commentary to=functions."
                - "<|channel|>analysis to=functions."
                - "<|channel|>final to=functions."
              tool_close:
                - "<|call|><|start|>assistant<|channel|>final<|message|>"
                - "<|call|>"
            tool_extraction_template: harmony # built-in

        # Gate: loop back into `generate` (with the parse error as a corrective
        # turn) ONLY when the model attempted a tool call and it failed to parse.
        # tool_parse_failed is "false" for a plain prose answer — e.g. the turn
        # AFTER a tool result comes back — so normal answers exit immediately;
        # gating on tool_parse_ok instead would regenerate every text answer.
        - id: repair_gate
          type: loop
          next_step: think_gate
          config:
            loopback_step: generate
            fallback_step: fallback
            max_iterations: 3
            condition:
              type: equals
              input_field: generate.tool_parse_failed
              match_value: "false"
            loopback_message:
              role: user
              content: "Your previous reply did not contain a valid tool call.{% if generate.attempted_tool %} You called '{{ generate.attempted_tool }}', which is not a declared tool.{% endif %}{% if generate.parse_error %} Parse error: {{ generate.parse_error }}.{% endif %} The ONLY valid tools are: {{ tool_names | join(', ') }}. Reply again with a single valid tool call using exactly one of those declared schemas — no prose, no other tool names."
            # Retries want determinism: near-greedy sampling raises tool-JSON
            # parse success. First attempt keeps the step's own sampling; the
            # override applies on the retry edge only and is cleared on exit.
            retry_sampling_params:
              temperature: 0.2

        # Second gate: catch "stuck reasoning" — the model spent the whole
        # generation thinking (unclosed <think> block, or Harmony analysis
        # channel with no final answer and no tool call). Loop back once with
        # an instruction to answer NOW; the retry sees its own reasoning in
        # context, so it usually just concludes.
        - id: think_gate
          type: loop
          next_step: done
          config:
            loopback_step: generate
            fallback_step: fallback
            max_iterations: 2
            condition:
              type: equals
              input_field: generate.thinking_unclosed
              match_value: "false"
            loopback_message:
              role: user
              content: "You spent the entire generation reasoning and never produced a final answer or tool call. Conclude NOW: give the final answer (or the tool call) directly, with no further deliberation."

        # Valid call extracted — halt cleanly; generate already streamed.
        - id: done
          type: break
          config:
            output_field: generate.output
            condition:
              type: not_empty
              input_field: generate.output

        # Loop exhausted — be honest instead of shipping a malformed call.
        - id: fallback
          type: infer
          role: output
          config:
            model_id: llm
            output_field: fallback.output
            context:
              reasoning_effort: low
            tags:
              reasoning_repeatable: true
              reasoning_open:
                - "<|end|><|start|>assistant<|channel|>analysis<|message|>"
                - "<|start|>assistant<|channel|>analysis<|message|>"
                - "<|channel|>analysis<|message|>"
              reasoning_close:
                - "<|end|><|start|>assistant<|channel|>final<|message|>"
                - "<|channel|>final<|message|>"
                - "<|end|>"
            prompt:
              messages:
                - role: user
                  content: "You repeatedly failed to produce a valid tool call for: {{prompt}}. Explain briefly, in plain text, what you would have done and ask the user to retry."
