# Pipeline — chain-of-thought with a self-refinement loop
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/pipelines/cot.yaml
#
#   reason ──→ evaluate ──→ loop_gate ──→ answer
#     ↑___________________________|
#     (loops back to refine while the evaluator says "NO", max 3 iterations)
#     └────────────────────────────────────────→ fallback_answer (loop exhausted)
#
# ONE model plays every role — it reasons, judges its own reasoning, refines on
# loop-back, and writes the answer. The interesting part is that the quality gate
# is a step in the graph, not a prompt instruction: `loop` re-enters `reason` with
# a corrective message until `condition` holds or `max_iterations` is spent, and
# `fallback_step` guarantees the caller still gets an answer either way.
#
# `role: thinking` + `strip_thinking` keep the deliberation OUT of the streamed
# response while leaving it in context for the later steps.
#
# Small models loop more: with Qwen3-0.6B expect the gate to fire often. That is
# the demo working, not failing — raise max_iterations or use a bigger model from
# examples/llama/ to see it settle on the first pass.

workspace:
  name: cot

  models:
    - id: llm
      name: Qwen/Qwen3-0.6B-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Qwen3-0.6B-Q8_0.gguf
        n_ctx: 8192
        n_seq_max: 4
        n_gpu_layers: 999
        flash_attn_type: AUTO

  pipelines:
    - id: cot
      name: Chain-of-Thought Pipeline
      entry: reason

      steps:
        # Think through the problem. Hidden reasoning (role: thinking) is stripped
        # from the streamed output but kept in context for the steps below.
        - id: reason
          type: infer
          role: thinking
          next_step: evaluate
          config:
            model_id: llm
            output_field: reason.output
            strip_thinking: true

        # Self-judge: is the reasoning conclusive? Emits a strict YES / NO.
        - id: evaluate
          type: infer
          role: internal
          next_step: loop_gate
          config:
            model_id: llm
            output_field: evaluate.output
            context: { enable_thinking: false }
            prompt:
              messages:
                - role: user
                  content: "Question: {{prompt}}\nReasoning so far: {{reason.output}}\nDoes the reasoning reach a clear, complete, final answer to the question? Reply with only YES or NO."

        # Gate: exit to `answer` when the evaluator says YES; otherwise loop back
        # to `reason` to refine. After max_iterations, go to `fallback_answer`.
        - id: loop_gate
          type: loop
          next_step: answer
          config:
            loopback_step: reason
            fallback_step: fallback_answer
            max_iterations: 3
            condition:
              type: contains
              input_field: evaluate.output
              match_value: "YES"
            loopback_message:
              role: user
              content: "Your previous reasoning was not yet conclusive (evaluator said '{{evaluate.output}}'). Continue your thinking — refine your analysis and work towards a clearer conclusion."

        # Condition met — produce the validated answer.
        - id: answer
          type: infer
          role: output
          config:
            model_id: llm
            output_field: answer.output
            context: { enable_thinking: false }
            prompt:
              messages:
                - role: user
                  content: "Based on this reasoning: {{reason.output}}\nGive a clear, concise answer to: {{prompt}}"

        # Max iterations exhausted — best-effort answer.
        - id: fallback_answer
          type: infer
          role: output
          config:
            model_id: llm
            output_field: fallback_answer.output
            context: { enable_thinking: false }
            prompt:
              messages:
                - role: user
                  content: "Based on the reasoning so far ({{reason.output}}), give your best concise answer to: {{prompt}}. If you are still unsure, say so honestly."
