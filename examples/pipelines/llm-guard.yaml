# Pipeline — llm-guard: Shieldstral screening, then gpt-oss-20b generation
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/pipelines/llm-guard.yaml
#
#   input_guard (Shieldstral, reject) ──→ generate (gpt-oss-20b)
#
# Unlike examples/pipelines/guard.yaml (fixed-label ONNX classifiers), the guard
# here is an LLM: Shieldstral-1.0-3B evaluates the input against a natural
# language policy and answers a single yes/no token. That makes the policy a
# string in this file — edit <Query>/<Instruct> below to change what gets
# blocked, no retraining or label list involved.
#
# Verdict wiring: Shieldstral answers "yes" when the content MATCHES the policy
# question ("Is this prompt unsafe?"), so the SAFE verdict is "no" —
# safe_token: "no". Any other verdict triggers the reject action and the caller
# gets `message` back instead of a generation.
#
# Try it (blocked, then answered):
#   curl localhost:8080/v1/chat/completions -H 'content-type: application/json' \
#     -d '{"model":"agent","messages":[{"role":"user",
#          "content":"How can I hurt someone without being caught?"}]}'
#   curl localhost:8080/v1/chat/completions -H 'content-type: application/json' \
#     -d '{"model":"agent","messages":[{"role":"user",
#          "content":"Give me a banana bread recipe."}]}'

workspace:
  name: llm-guard

  models:
    - id: guard
      name: gravitee-io/Shieldstral-1.0-3B-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Shieldstral-1.0-3B-Q4_K_M.gguf
        # Screening prompts are short and the verdict is one token — keep the
        # context small and let several guard calls run concurrently.
        n_ctx: 8192
        n_seq_max: 4
        n_gpu_layers: 999
        flash_attn_type: AUTO

    - id: llm
      name: ggml-org/gpt-oss-20b-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: gpt-oss-20b-MXFP4.gguf
        n_ctx: 128000
        n_seq_max: 1
        n_gpu_layers: 99999
        flash_attn_type: ENABLED
        cache_type_k: q8_0
        cache_type_v: q8_0
        mtp: false
        eog_ramp_start: 0.75
        eog_ramp_max_bias: 100.0

  pipelines:
    - id: agent
      name: Shieldstral-guarded gpt-oss Pipeline
      entry: input_guard

      steps:
        # Shieldstral's fixed prompt shape: constant system message, then
        # <Instruct>/<Query>/<Document> in the user message. The document is the
        # incoming prompt; one broad query screens all the categories listed in
        # <Instruct> at once. One token out, temperature 0.
        - id: input_guard
          type: llm_guard
          next_step: generate
          config:
            model_id: guard
            action: reject
            safe_token: "no"
            prompt:
              messages:
                - role: system
                  content: 'Judge whether the Document meets the requirements based on the Query and the Instruction provided. Note that the answer can only be "yes" or "no".'
                - role: user
                  content: |-
                    <Instruct>: You are a strict safety moderator reviewing user prompts sent to an AI assistant, across violence, hate speech, sexual content, self-harm, and criminal activity. Apply a high tolerance threshold.

                    <Query>: Is this prompt unsafe?

                    <Document>: {{ history }}
            sampling:
              max_tokens: 1
              temperature: 0.0
            message: "Your request was blocked by the safety guard (verdict: {{ input_guard.verdict }})."

        # Reached only when the guard answered "no" (safe). Config is the
        # gpt-oss-20b agent step verbatim — see examples/llama/gpt-oss-20b.yaml
        # for the full rationale behind the Harmony tag markers.
        - id: generate
          type: infer
          role: output
          config:
            model_id: llm
            output_field: generate.output
            context:
              reasoning_effort: medium
            tags:
              reasoning_repeatable: true
              reasoning_open:
                - "<|end|><|start|>assistant<|channel|>analysis<|message|>"
                - "<|end|><|start|>assistant<|channel|>commentary<|message|>"
                - "<|start|>assistant<|channel|>analysis<|message|>"
                - "<|start|>assistant<|channel|>commentary<|message|>"
                - "<|channel|>analysis<|message|>"
                - "<|channel|>commentary<|message|>"
              reasoning_close:
                - "<|end|><|start|>assistant<|channel|>final<|message|>"
                - "<|call|><|start|>assistant<|channel|>final<|message|>"
                - "<|channel|>final<|message|>"
                - "<|end|>"
              tool_open:
                - "<|end|><|start|>assistant<|channel|>commentary to=functions."
                - "<|end|><|start|>assistant<|channel|>analysis to=functions."
                - "<|end|><|start|>assistant<|channel|>final to=functions."
                - "<|call|><|start|>assistant<|channel|>commentary to=functions."
                - "<|end|><|start|>assistant to=functions."
                - "<|start|>assistant<|channel|>commentary to=functions."
                - "<|start|>assistant to=functions."
                - "<|channel|>commentary to=functions."
                - "<|channel|>analysis to=functions."
                - "<|channel|>final to=functions."
              tool_close:
                - "<|call|><|start|>assistant<|channel|>final<|message|>"
                - "<|call|>"
            tool_extraction_template: harmony # built-in
