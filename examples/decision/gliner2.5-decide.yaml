# GLiNER2.5-Decide as a decision model
#
# Standalone workspace. GLiNER2.5-Decide runs as a gliner4j bundle exported for
# the llama.cpp engine: build it with GLiNER4j's `task decide:llamacpp`, then
# set model_dir to the bundle directory (models/decide-llamacpp in GLiNER4j).
# Run it with:
#   ./run-server.sh --workspace examples/decision/gliner2.5-decide.yaml
#
# A 340M encoder, not a language model: each question is one classification
# task about the state (its id and instructions are the task, its options the
# labels), and a softmax over the label scores gives one probability per option.
# No prompt to render, so it takes a state and questions only.
#
#   curl -s localhost:8080/v1/decisions -H 'Content-Type: application/json' -d '{
#     "model": "decide",
#     "input": "Someone changed the password on my account last night and moved money out of it.",
#     "questions": [
#       {"id": "intent", "type": "choice", "instructions": "What does the customer want?",
#        "options": [{"key": "billing_issue", "description": "A wrong, double or unexpected charge"},
#                    {"key": "account_security", "description": "Someone else got into the account"},
#                    {"key": "order_status", "description": "Where an order or a parcel is"}]},
#       {"id": "handoff", "type": "noul", "instructions": "Does the customer ask for a human agent?"},
#       {"id": "urgency", "type": "score", "instructions": "How urgent is this?",
#        "levels": ["low", "normal", "high"]}
#     ]
#   }' | jq
#
# The same model answers TypeSafe's System One shape on POST /v1/systemone.

workspace:
  name: gliner2.5-decide
  models:
    - id: decide
      name: fastino/GLiNER2.5-Decide
      type: gliner_decision
      memory_check: disabled
      gliner_decision:
        model_dir: models/decide-llamacpp
