# Qwen3.6-35B · vLLM backend
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/vllm/qwen3.6-35b.yaml
#
# MoE 36B (256 experts), 262144-token positional encoding capped here to 131072.
# Multimodal-capable architecture (Qwen3_5MoeForConditionalGeneration) — see
# qwen3-vl-2b.yaml for how images are sent. ~72GB of bf16 weights, so
# tensor_parallel_size 2 at minimum.
#
# ⚠ Linux + CUDA only. vLLM runs from a host venv (scripts/setup-venv.sh) unless
#   you use the -vllm-cuda image, which bundles it:
#     ./run-server.sh --workspace examples/vllm/qwen3.6-35b.yaml   -Dvllm4j.venv=/path/to/.venv
#
# NEVER co-locate vLLM with llama.cpp or ONNX in one JVM — each loads its own
# native CUDA bindings. One backend per server, composed over gRPC.

workspace:
  name: qwen3.6-35b

  models:
    - id: llm
      name: Qwen/Qwen3.6-35B-A3B
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        max_model_len: 131072
        max_num_seqs: 4
        gpu_memory_utilization: 0.9
        enforce_eager: false
        enable_prefix_caching: true
        tensor_parallel_size: 2

  pipelines:
    - id: agent
      name: Qwen3.6-35B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: false
            tags:
              reasoning_open: "<think>"
              reasoning_close: "</think>"
              tool_open: "<tool_call>"
              tool_close: "</tool_call>"
