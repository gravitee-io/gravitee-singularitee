# Moonlight-16B · vLLM backend
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/vllm/moonlight-16b.yaml
#
# MoE 16B (3B active, 64 experts) on the DeepSeek-V3 architecture, bf16. Note the
# short 8192-token positional encoding — the smallest window of any model here.
# trust_remote_code is required: the checkpoint ships its own config class.
#
# ⚠ Linux + CUDA only. vLLM runs from a host venv (scripts/setup-venv.sh) unless
#   you use the -vllm-cuda image, which bundles it:
#     ./run-server.sh --workspace examples/vllm/moonlight-16b.yaml   -Dvllm4j.venv=/path/to/.venv
#
# NEVER co-locate vLLM with llama.cpp or ONNX in one JVM — each loads its own
# native CUDA bindings. One backend per server, composed over gRPC.

workspace:
  name: moonlight-16b

  models:
    - id: llm
      name: moonshotai/Moonlight-16B-A3B-Instruct
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        max_model_len: 8192
        max_num_seqs: 8
        gpu_memory_utilization: 0.85
        enforce_eager: false
        enable_prefix_caching: true
        trust_remote_code: true

  pipelines:
    - id: agent
      name: Moonlight-16B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
