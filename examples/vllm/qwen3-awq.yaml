# Qwen3-4B AWQ 4-bit · vLLM backend
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/vllm/qwen3-awq.yaml
#
# ⚠ Linux + CUDA only, requires -Dvllm4j.venv=/path/to/.venv (scripts/setup-venv.sh).
# ⚠ WORK IN PROGRESS — see the note in qwen3-gptq.yaml.
#
# 4-bit AWQ: ~4x memory reduction vs bfloat16, 10-20% faster than GPTQ at the
# same bit-width. Fits a 4B model where the GPTQ-Int8 0.6B config would not pay off.

workspace:
  name: qwen3-awq

  models:
    - id: llm
      name: Qwen/Qwen3-4B-AWQ
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        quantization: awq
        max_model_len: 4096
        max_num_seqs: 8
        gpu_memory_utilization: 0.35
        enforce_eager: false
        trust_remote_code: true
        enable_prefix_caching: true
        enable_sleep_mode: false

  pipelines:
    - id: agent
      name: vLLM AWQ Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: false
