# Qwen3-30B · vLLM backend
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/vllm/qwen3-30b.yaml
#
# MoE 30.5B (3B active, 128 experts), bf16, 262144-token positional encoding
# capped here to 131072. ~61GB of bf16 weights: too much for one 48GB card, hence
# tensor_parallel_size 2. Drop it to 1 on a single 80GB card, or set it once for
# the whole deployment via GRAVITEE_AI_VLLM_TENSORPARALLELSIZE.
#
# ⚠ Linux + CUDA only. vLLM runs from a host venv (scripts/setup-venv.sh) unless
#   you use the -vllm-cuda image, which bundles it:
#     ./run-server.sh --workspace examples/vllm/qwen3-30b.yaml   -Dvllm4j.venv=/path/to/.venv
#
# NEVER co-locate vLLM with llama.cpp or ONNX in one JVM — each loads its own
# native CUDA bindings. One backend per server, composed over gRPC.

workspace:
  name: qwen3-30b

  models:
    - id: llm
      name: Qwen/Qwen3-30B-A3B-Instruct-2507
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        max_model_len: 131072
        max_num_seqs: 4
        gpu_memory_utilization: 0.9
        enforce_eager: false
        enable_prefix_caching: true
        tensor_parallel_size: 2

  pipelines:
    - id: agent
      name: Qwen3-30B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: false
            tags:
              reasoning_open: "<think>"
              reasoning_close: "</think>"
              tool_open: "<tool_call>"
              tool_close: "</tool_call>"
