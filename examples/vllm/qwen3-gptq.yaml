# Qwen3-0.6B GPTQ-Int8 · vLLM backend
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/vllm/qwen3-gptq.yaml
#
# ⚠ Linux + CUDA only, and requires the vLLM virtualenv on the JVM command line:
#     -Dvllm4j.venv=/path/to/.venv        (see scripts/setup-venv.sh)
#   vLLM is NOT baked into the Docker images — it runs from a host venv.
#
# ⚠ WORK IN PROGRESS. The vLLM backend is less exercised than llama.cpp: treat
#   these two files as a starting point, not a tuned production config. Prefer
#   examples/llama/ unless you specifically need PagedAttention / vLLM's
#   continuous batching on CUDA.
#
# 8-bit GPTQ: ~2x memory reduction vs bfloat16, near-lossless quality.
# NEVER co-locate vLLM with llama.cpp or ONNX in one JVM — each engine loads its
# own native CUDA bindings. One backend per server, composed over gRPC.

workspace:
  name: qwen3-gptq

  models:
    - id: llm
      name: Qwen/Qwen3-0.6B-GPTQ-Int8
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        quantization: gptq
        max_model_len: 4096
        max_num_seqs: 8
        gpu_memory_utilization: 0.35
        enforce_eager: false
        trust_remote_code: true
        enable_prefix_caching: true
        enable_sleep_mode: false

  pipelines:
    - id: agent
      name: vLLM GPTQ Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: false
