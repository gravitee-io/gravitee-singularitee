# Qwen3-0.6B · vLLM backend
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/vllm/qwen3-0.6b.yaml
#
# The smallest useful text model here — the one to smoke-test a vLLM deployment
# with before committing a GPU to something larger. Dense 0.6B, bf16, 40960-token
# positional encoding. Hybrid thinking: enable_thinking drives <think> blocks.
#
# ⚠ Linux + CUDA only. vLLM runs from a host venv (scripts/setup-venv.sh) unless
#   you use the -vllm-cuda image, which bundles it:
#     ./run-server.sh --workspace examples/vllm/qwen3-0.6b.yaml   -Dvllm4j.venv=/path/to/.venv
#
# NEVER co-locate vLLM with llama.cpp or ONNX in one JVM — each loads its own
# native CUDA bindings. One backend per server, composed over gRPC.

workspace:
  name: qwen3-0.6b

  models:
    - id: llm
      name: Qwen/Qwen3-0.6B
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        max_model_len: 40960
        max_num_seqs: 16
        gpu_memory_utilization: 0.45
        enforce_eager: false
        enable_prefix_caching: true

  pipelines:
    - id: agent
      name: Qwen3-0.6B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: true
            tags:
              reasoning_open: "<think>"
              reasoning_close: "</think>"
              tool_open: "<tool_call>"
              tool_close: "</tool_call>"
