# Qwen3-VL-2B · vLLM backend
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/vllm/qwen3-vl-2b.yaml
#
# VISION model — the vLLM counterpart of examples/llama/qwen3-vl-2b.yaml.
#
# Unlike llama.cpp there is no mmproj file to point at: vLLM loads the vision
# tower from the same checkpoint, so there is nothing extra to configure. Images
# arrive as base64 on the request and are decoded into vLLM's MultiModalData; the
# chat template inserts the placeholder tokens.
#
# Dense 2.1B + vision tower, 262144-token positional encoding capped to 32768
# here — image tokens are charged against the same window, and a single 1024x1024
# image is worth well over a thousand of them.
#
# ⚠ Linux + CUDA only. vLLM runs from a host venv (scripts/setup-venv.sh) unless
#   you use the -vllm-cuda image, which bundles it:
#     ./run-server.sh --workspace examples/vllm/qwen3-vl-2b.yaml   -Dvllm4j.venv=/path/to/.venv
#
# NEVER co-locate vLLM with llama.cpp or ONNX in one JVM — each loads its own
# native CUDA bindings. One backend per server, composed over gRPC.

workspace:
  name: qwen3-vl-2b

  models:
    - id: llm
      name: Qwen/Qwen3-VL-2B-Instruct
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        max_model_len: 32768
        max_num_seqs: 4
        gpu_memory_utilization: 0.6
        enforce_eager: false
        enable_prefix_caching: true

  pipelines:
    - id: agent
      name: Qwen3-VL-2B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
