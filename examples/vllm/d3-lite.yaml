# vLLM Semantic Router Decision 3.0: d3-lite
#
# Standalone workspace. Needs vllm-srun in the venv (scripts/setup-venv.sh -r).
# Run it with:
#   ./run-server.sh --workspace examples/vllm/d3-lite.yaml
#
# The 1.7 GB member of Decision 3.0 (vllm-sr/d3 is the 27B one). Its runtime
# (vllm_srun) renders the prompt and reads every answer from a code readout,
# in-process in the embedded CPython; it downloads the pinned revision and
# checks its files and golden answers before the model is published. The
# family, decision3, is read from the id. Text only here: image and video inputs
# are not served yet. On Apple Silicon set device: mps: on CPU the answers drift
# past the runtime's golden-answer tolerance and the model is refused.
#
#   curl -s localhost:8080/v1/systemone -H 'Content-Type: application/json' -d '{
#     "model": "d3",
#     "state": "The order arrived damaged yesterday. The customer has a receipt and asks for a replacement today.",
#     "questions": {
#       "route":   {"type": "choice", "instructions": "Which team should handle this request?",
#                   "criteria": {"returns": "Refunds, replacements and damaged deliveries",
#                                "billing": "Payments, invoices and charges"}},
#       "receipt": {"type": "noul", "instructions": "Does the customer have a receipt?"},
#       "urgency": {"type": "score", "instructions": "How urgent is this request?",
#                   "criteria": ["Routine", "Soon", "Today"]}
#     }
#   }' | jq

workspace:
  name: d3-lite
  models:
    - id: d3
      name: vllm-sr/d3-lite
      type: vllm_decision
      memory_check: warn
      vllm_decision:
        device: auto
