# gpt-oss-20b · vLLM backend · sized for an 80 GB card (A100 80GB / H100)
#
# The sibling examples/vllm/gpt-oss-20b.yaml is deliberately conservative so it
# loads on a wide range of cards. This one assumes the whole 80 GB and raises
# concurrency to match, which is the difference between serving one user and
# serving a workload.
#
#   weights (MXFP4)          13.8 GB
#   budget at 0.85 of 80 GB  68.0 GB
#   CUDA graphs + activations ~3 GB
#   left for KV cache        ~50 GB
#
# KV is cheaper here than the parameter count suggests: of the 24 layers, 12 are
# sliding-window (128 tokens) and only 12 are full attention, so a token costs
# ~24 KiB rather than 48 — a full 131k-token sequence is ~3.2 GB. That budget
# therefore holds roughly 15 simultaneous *maximum-length* sequences, and far
# more typical ones, so max_num_seqs is raised from 8 to 32. vLLM still admits
# by available KV blocks, so this is a ceiling rather than a reservation.
#
# On a 40 GB A100 drop max_num_seqs back to 8 and max_model_len to ~65536.
#
# MoE 21B (32 experts), 131k context. Ships PRE-QUANTIZED (MXFP4) — leave
# `quantization` unset so vLLM reads it from the checkpoint's own
# quantization_config rather than being told something that contradicts it.
# The VRAM pre-flight reads those 4-bit weights correctly.
#
# MXFP4 needs compute capability >= 8.0, so A100 (sm_80) and H100 (sm_90) both
# qualify; the fastest kernels (FlashInfer CUTLASS on SM90, TRTLLM on SM100+)
# are Hopper and newer, and Ampere falls back to Triton/Marlin. Do not swap in
# an FP8 checkpoint if the same image must run on A100 — that card has no FP8
# tensor cores.
#
# ⚠ Linux + CUDA only. vLLM runs from a host venv (scripts/setup-venv.sh) unless
#   you use the -vllm-cuda image, which bundles it:
#     ./run-server.sh --workspace examples/vllm/gpt-oss-20b-80gb.yaml
#
# NEVER co-locate vLLM with llama.cpp or ONNX in one JVM — each loads its own
# native CUDA bindings. One backend per server, composed over gRPC.

workspace:
  name: gpt-oss-20b

  models:
    - id: llm
      name: openai/gpt-oss-20b
      type: vllm
      memory_check: warn
      # The repo ships the same weights three times: the sharded safetensors
      # vLLM loads (13.8 GB), original/model.safetensors (another 13.8 GB), and
      # metal/model.bin for Apple's runtime (13.7 GB). The .bin is already
      # skipped — safetensors is the preferred format — but original/ is
      # safetensors too, so without this the download is 27.5 GB for a 13.8 GB
      # model.
      download:
        exclude:
          - "original/*"
      vllm:
        dtype: auto
        max_model_len: 131072
        max_num_seqs: 32
        gpu_memory_utilization: 0.85
        enforce_eager: false
        enable_prefix_caching: true

  pipelines:
    - id: agent
      name: gpt-oss-20b Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            # Harmony renders "Reasoning: <effort>" into the system block from this
            # variable (low | medium | high; the template defaults to medium when
            # unset). Set explicitly so the knob is visible — lower it for latency,
            # raise it for harder tasks. Step context merges into the Jinja root, so
            # this is just a template variable; models that don't read it ignore it.
            context:
              # medium, not low: at low this model writes malformed JSON for tool
              # arguments often enough to break agent flows — mismatched brackets,
              # one edit split across two objects, stray trailing punctuation. The
              # extra reasoning tokens cost latency; a rejected tool call costs the
              # whole turn.
              reasoning_effort: medium
            tags:
              # Harmony enters its non-answer channels two ways, and re-enters them
              # WITHIN one generation: analysis, back to final, then a commentary
              # preamble before a tool call. Without reasoning_repeatable that second
              # opening stops matching and its header reaches the client as raw text
              # ("<|channel|>commentary<|message|>Now step 2..."), billed as answer.
              # Every run-anchored form, exactly like tool_open: a chained transition
              # (analysis straight into a commentary preamble) emits
              # <|end|><|start|>assistant<|channel|>commentary<|message|> as ONE run,
              # and a marker anchored at <|channel|> can never match it — the whole
              # header leaked into the stream as raw text.
              reasoning_open:
                - "<|end|><|start|>assistant<|channel|>analysis<|message|>"
                - "<|end|><|start|>assistant<|channel|>commentary<|message|>"
                - "<|start|>assistant<|channel|>analysis<|message|>"
                - "<|start|>assistant<|channel|>commentary<|message|>"
                - "<|channel|>analysis<|message|>"
                - "<|channel|>commentary<|message|>"
              reasoning_repeatable: true
              # Two ways out of the analysis channel. Answering directly, the run ends
              # with <|end|> and the final header follows; when a tool call intervenes
              # the terminator is <|call|> instead. Listing one marker leaks the other
              # path's header into the answer as visible syntax.
              reasoning_close:
                - "<|end|><|start|>assistant<|channel|>final<|message|>"
                - "<|call|><|start|>assistant<|channel|>final<|message|>"
                # The bare header, for the turn that FOLLOWS a tool call: that
                # generation starts fresh with no analysis span open, and the model
                # still prefixes its reply with it. A close marker reaching the
                # answer channel is stray syntax, so it is suppressed there too —
                # otherwise the reply reads "<|channel|>final<|message|>DONE".
                - "<|channel|>final<|message|>"
                # Bare terminator, as a safety net: when <|end|> is followed by
                # something no marker anticipates, the short close settles and only
                # the genuinely unknown remainder shows — instead of the whole
                # buffered header. Longest match keeps the folded forms winning.
                - "<|end|>"
              # BOTH header orders occur in practice. Observed live:
              # "<|end|><|start|>assistant<|channel|>commentary to=functions.write", i.e.
              # the channel segment BEFORE to=functions; the form without it shows up too.
              # Listing only one leaks the other's entire header into the answer as visible
              # syntax. The <|end|>/<|call|>-prefixed forms matter because a run that leaves
              # the analysis channel for a tool call starts at that terminator — nothing
              # else consumes it — so a marker anchored at <|channel|> can never match there.
              tool_open:
                - "<|end|><|start|>assistant<|channel|>commentary to=functions."
                - "<|end|><|start|>assistant<|channel|>analysis to=functions."
                - "<|end|><|start|>assistant<|channel|>final to=functions."
                - "<|call|><|start|>assistant<|channel|>commentary to=functions."
                - "<|end|><|start|>assistant to=functions."
                - "<|start|>assistant<|channel|>commentary to=functions."
                - "<|start|>assistant to=functions."
                - "<|channel|>commentary to=functions."
                - "<|channel|>analysis to=functions."
                - "<|channel|>final to=functions."
              # Longest first: when the model continues past the call, the header is part
              # of the marker; when <|call|> ends generation (the agent flow, it is an EOS
              # token) the short form settles the span at flush.
              tool_close:
                - "<|call|><|start|>assistant<|channel|>final<|message|>"
                - "<|call|>"
            tool_extraction_template: harmony # built-in
