# Qwen2.5-0.5B · vLLM backend
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/vllm/qwen2.5-0.5b.yaml
#
# Dense 0.5B, bf16, 32k context. No thinking mode — Qwen2.5 predates it, so no
# reasoning tags are configured; tool calls still use the ChatML markers.
#
# ⚠ Linux + CUDA only. vLLM runs from a host venv (scripts/setup-venv.sh) unless
#   you use the -vllm-cuda image, which bundles it:
#     ./run-server.sh --workspace examples/vllm/qwen2.5-0.5b.yaml   -Dvllm4j.venv=/path/to/.venv
#
# NEVER co-locate vLLM with llama.cpp or ONNX in one JVM — each loads its own
# native CUDA bindings. One backend per server, composed over gRPC.

workspace:
  name: qwen2.5-0.5b

  models:
    - id: llm
      name: Qwen/Qwen2.5-0.5B-Instruct
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        max_model_len: 32768
        max_num_seqs: 16
        gpu_memory_utilization: 0.45
        enforce_eager: false
        enable_prefix_caching: true

  pipelines:
    - id: agent
      name: Qwen2.5-0.5B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: false
            tags:
              reasoning_open: "<think>"
              reasoning_close: "</think>"
