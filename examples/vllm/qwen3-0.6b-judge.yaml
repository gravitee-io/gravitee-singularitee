# Qwen3-0.6B as a decision model on vLLM
#
# Standalone workspace. Run it with:
#   ./run-server.sh --workspace examples/vllm/qwen3-0.6b-judge.yaml
#
# Any causal model vLLM serves answers typed questions (choice, score, noul)
# in one forward pass: the server wraps a shipped instruction in the model's
# chat template, prefills "Answer: (" and reads the log probabilities of the
# label codes A, B, C... (vLLM's logprob_token_ids). One token is computed and
# discarded; the probabilities are real ones rather than a parsed string.
# The llama.cpp equivalent is examples/decision/qwen3-0.6b-judge.yaml.
#
#   curl -s localhost:8080/v1/decisions -H 'Content-Type: application/json' -d '{
#     "model": "judge",
#     "input": "Customer message: I was charged twice for my order and nobody has replied.",
#     "questions": [
#       {"id": "route", "type": "choice", "instructions": "Which team should handle this?",
#        "options": [{"key": "billing"}, {"key": "shipping"}, {"key": "technical"}]},
#       {"id": "angry", "type": "noul", "instructions": "Is the customer angry?"},
#       {"id": "urgency", "type": "score", "instructions": "How urgent is this?",
#        "levels": ["can wait", "this week", "today", "right now"]}
#     ]
#   }' | jq

workspace:
  name: qwen3-0.6b-vllm-judge

  models:
    - id: judge
      name: Qwen/Qwen3-0.6B
      type: vllm_decision
      memory_check: warn
      vllm_decision:
        family: custom
        debias: reverse
        prompt:
          template: chat
        vllm:
          dtype: auto
          max_model_len: 4096
          max_num_seqs: 16
          gpu_memory_utilization: 0.3
          enforce_eager: true
