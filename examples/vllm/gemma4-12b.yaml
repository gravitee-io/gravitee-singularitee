# Gemma 4 12B · vLLM backend
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/vllm/gemma4-12b.yaml
#
# Dense 12B, bf16, 262144-token positional encoding capped here to 131072.
# A VISION model (Gemma4UnifiedForConditionalGeneration) despite the name — the
# pre-flight applies the wider multimodal safety margin automatically, because it
# sees vision_config in the checkpoint.
#
# ⚠ Linux + CUDA only. vLLM runs from a host venv (scripts/setup-venv.sh) unless
#   you use the -vllm-cuda image, which bundles it:
#     ./run-server.sh --workspace examples/vllm/gemma4-12b.yaml   -Dvllm4j.venv=/path/to/.venv
#
# NEVER co-locate vLLM with llama.cpp or ONNX in one JVM — each loads its own
# native CUDA bindings. One backend per server, composed over gRPC.

workspace:
  name: gemma4-12b

  models:
    - id: llm
      name: google/gemma-4-12B-it
      type: vllm
      memory_check: warn
      vllm:
        dtype: auto
        max_model_len: 131072
        max_num_seqs: 4
        gpu_memory_utilization: 0.85
        enforce_eager: false
        enable_prefix_caching: true

  pipelines:
    - id: agent
      name: Gemma 4 12B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: true
            tags:
              reasoning_open: "<|channel>thought"
              reasoning_close: "<channel|>"
              tool_open: "<|tool_call>"
              tool_close: "<tool_call|>"
            tool_extraction_template: gemma-call # built-in
