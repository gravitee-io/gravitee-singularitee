# Moonlight-16B-A3B-Instruct · chat only
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/llama/moonlight-16b.yaml
#
# One model (id: llm) and one pipeline (id: agent), so the same client config and
# curls work across every example file. Prose, measurements and caveats for this
# model live in docs/models/README.md.
#
# n_ctx is PER SEQUENCE: total KV allocated is n_ctx * n_seq_max.
# Moonshot, MIT. DeepSeek-V3-style MoE with MLA attention. Instruct-tuned but NOT
# tool-trained — validated for chat and cache behaviour, not tool loops. No tags
# or extraction template: it has no tool dialect to configure.

workspace:
  name: moonlight-16b

  models:
    - id: llm
      name: gabriellarson/Moonlight-16B-A3B-Instruct-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Moonlight-16B-A3B-Instruct-Q4_K_M.gguf
        n_ctx: 8192
        n_seq_max: 1
        n_gpu_layers: 999
        flash_attn_type: AUTO
        mtp: false

  pipelines:
    - id: agent
      name: Moonlight Chat Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
