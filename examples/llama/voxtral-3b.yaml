# Voxtral-Mini-3B-2507 · audio (multimodal)
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/llama/voxtral-3b.yaml
#
# Same mechanism as the vision model: `mmproj_path` is the AUDIO projection GGUF.
# When set, the engine loads an MtmdContext and the model accepts audio content
# parts (speech understanding / transcription / spoken Q&A). Prompts render from
# Voxtral's own embedded chat template; mtmd_tokenize wraps the injected media
# marker with Voxtral's audio tokens (<|audio_bos|> … <|audio_eos|>).
#
# Send audio (base64 or data URL; wav/mp3):
#   {"model":"llm","messages":[{"role":"user","content":[
#     {"type":"text","text":"Answer the spoken question."},
#     {"type":"input_audio","input_audio":{"data":"<base64>","format":"wav"}}]}]}
#
# Try it live (push-to-talk):
#   uv run --with openai --with sounddevice examples/scripts/audio_ptt.py

workspace:
  name: voxtral-3b

  models:
    - id: llm
      name: ggml-org/Voxtral-Mini-3B-2507-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Voxtral-Mini-3B-2507-Q4_K_M.gguf
        mmproj_path: mmproj-Voxtral-Mini-3B-2507-Q8_0.gguf
        # Audio expands to many tokens; keep concurrency at 1 so the per-sequence
        # context (n_ctx / n_seq_max) is large enough for a full clip.
        n_ctx: 16384
        n_seq_max: 1
        n_batch: 2048
        n_ubatch: 2048
        n_gpu_layers: 999
        flash_attn_type: AUTO

  pipelines:
    - id: agent
      name: Voxtral Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
