# Qwen2.5-0.5B-Instruct · background tasks
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/llama/qwen2.5-0.5b.yaml
#
# One model (id: llm) and one pipeline (id: agent), so the same client config and
# curls work across every example file. Prose, measurements and caveats for this
# model live in docs/models/README.md.
#
# n_ctx is PER SEQUENCE: total KV allocated is n_ctx * n_seq_max.
# Small model for title generation and summaries, so background jobs never touch
# the main model's KV slot. Pre-thinking family: it cannot emit reasoning by
# construction — preferable to a small Qwen3, which ignores enable_thinking:
# false unreliably. NOT for tool loops: 0.5B tool-call JSON is unreliable.

workspace:
  name: qwen2.5-0.5b

  models:
    - id: llm
      name: Qwen/Qwen2.5-0.5B-Instruct-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: qwen2.5-0.5b-instruct-q8_0.gguf
        n_ctx: 8192
        n_seq_max: 1
        n_gpu_layers: 999
        flash_attn_type: AUTO
        mtp: false

  pipelines:
    - id: agent
      name: Small Tasks Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: false
            tags:
              reasoning_open: "<think>"
              reasoning_close: "</think>"
