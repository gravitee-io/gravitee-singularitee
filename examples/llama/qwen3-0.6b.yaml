# Qwen3-0.6B · the reference model
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/llama/qwen3-0.6b.yaml
#
# THE default across the examples: every pipeline in examples/pipelines/ binds
# its generation model to this one. Small enough to download in seconds and run
# on a laptop CPU, big enough to follow instructions, call tools and reason.
# Cross-platform (macOS/Metal, Linux CPU/CUDA) with no extra runtime.
#
# One model (id: llm) and one pipeline (id: agent), so the same client config and
# curls work across every example file.
#
# n_ctx is PER SEQUENCE: total KV allocated is n_ctx * n_seq_max.

workspace:
  name: qwen3-0.6b

  models:
    - id: llm
      name: Qwen/Qwen3-0.6B-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Qwen3-0.6B-Q8_0.gguf
        n_ctx: 8192
        n_seq_max: 4
        n_gpu_layers: 999
        flash_attn_type: AUTO

  pipelines:
    - id: agent
      name: Qwen3-0.6B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            # Qwen3 is a hybrid thinking model. The chat template renders an empty
            # <think></think> prefill when enable_thinking is false — a deterministic
            # bypass, unlike the "/no_think" prompt hack. Flip to true for reasoning.
            context:
              enable_thinking: false
            tags:
              reasoning_open: "<think>"
              reasoning_close: "</think>"
              tool_open: "<tool_call>"
              tool_close: "</tool_call>"
