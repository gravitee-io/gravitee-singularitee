# Qwen3-0.6B · structured output
#
# Standalone workspace. Run it with:
#   ./run-server.sh --workspace examples/llama/qwen3-0.6b-structured.yaml
#
# Constrained decoding: when the caller sends an OpenAI `response_format`, the answer always
# matches it, because tokens that would break it are never sampled. Nothing is declared in the
# workspace; the format travels with the request and lands on the `role: output` step.
#
#   curl -s localhost:8080/v1/chat/completions -H 'Content-Type: application/json' -d '{
#     "model": "agent",
#     "messages": [{"role": "user", "content": "Invent a fantasy character."}],
#     "response_format": {"type": "json_schema", "json_schema": {"name": "character",
#       "schema": {"type": "object", "required": ["name", "level"],
#         "properties": {"name": {"type": "string"}, "level": {"type": "integer"}}}}}
#   }' | jq -r '.choices[0].message.content'
#
# Thinking is off: the format applies from the first token, so a reasoning block would have
# to match it too.

workspace:
  name: qwen3-0.6b-structured

  models:
    - id: llm
      name: Qwen/Qwen3-0.6B-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Qwen3-0.6B-Q8_0.gguf
        n_ctx: 8192
        n_seq_max: 4
        n_gpu_layers: 999
        flash_attn_type: AUTO

  pipelines:
    - id: agent
      name: Qwen3-0.6B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: false
            tags:
              reasoning_open: "<think>"
              reasoning_close: "</think>"
