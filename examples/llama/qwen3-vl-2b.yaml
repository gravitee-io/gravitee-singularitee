# Qwen3-VL-2B-Instruct · vision (multimodal)
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/llama/qwen3-vl-2b.yaml
#
# The ONLY difference from a text-only model is `mmproj_path`, the vision
# projection GGUF. When set, the llama.cpp engine loads an MtmdContext and the
# model accepts image content parts. Prompts render from Qwen3-VL's OWN chat
# template embedded in the GGUF (via Jinja4j); the engine injects the model's
# media marker once per image and mtmd_tokenize replaces it with vision tokens.
#
# Nothing here declares the modality: the projector is asked at load time, so
# /v1/models reports this model as `"input_modalities": ["text", "image"]` and an
# audio clip sent to it is refused with `unsupported_modality`.
#
# Send an image (base64 or data URL — remote http(s) URLs are rejected with 400):
#   {"model":"llm","messages":[{"role":"user","content":[
#     {"type":"text","text":"What is in this image?"},
#     {"type":"image_url","image_url":{"url":"data:image/png;base64,<...>"}}]}]}
#
# Try it live:  uv run --with openai --with opencv-python examples/scripts/vision_live.py

workspace:
  name: qwen3-vl-2b

  models:
    - id: llm
      name: Qwen/Qwen3-VL-2B-Instruct-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Qwen3VL-2B-Instruct-Q8_0.gguf
        mmproj_path: mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf
        # Images are token-hungry; give each request room and keep concurrency low
        # so the per-sequence context (n_ctx / n_seq_max) stays large enough.
        n_ctx: 16384
        n_seq_max: 1
        n_batch: 2048
        n_ubatch: 2048
        n_gpu_layers: 999
        flash_attn_type: AUTO

  pipelines:
    - id: agent
      name: Qwen3-VL Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
