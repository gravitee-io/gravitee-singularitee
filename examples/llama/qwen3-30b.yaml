# Qwen3-30B-A3B-Instruct-2507 · ChatML · the reference agent model
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/llama/qwen3-30b.yaml
#
# One model (id: llm) and one pipeline (id: agent), so the same client config and
# curls work across every example file. Prose, measurements and caveats for this
# model live in docs/models/README.md.
#
# n_ctx is PER SEQUENCE: total KV allocated is n_ctx * n_seq_max.
# MoE (3B active), plain attention, Apache-2.0. Built-in dialect, nothing to
# configure. M4 Max: ~95 ms warm TTFT, ~84 tok/s decode (drifting to ~34 tok/s at
# 30k context — the full-attention depth tax).

workspace:
  name: qwen3-30b

  models:
    - id: llm
      name: unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
        n_ctx: 131072
        n_seq_max: 1
        n_gpu_layers: 999
        flash_attn_type: ENABLED # required for quantized V cache
        cache_type_k: q8_0
        cache_type_v: q8_0
        mtp: false # no MTP head on this model

  pipelines:
    - id: agent
      name: Qwen3-30B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: false
            tags:
              reasoning_open: "<think>"
              reasoning_close: "</think>"
              tool_open: "<tool_call>"
              tool_close: "</tool_call>"
            # extraction: chatml-json built-in (default order) — nothing to set
