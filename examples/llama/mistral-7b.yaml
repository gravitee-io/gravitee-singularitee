# Mistral-7B-Instruct-v0.3 · general purpose
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/llama/mistral-7b.yaml
#
# A larger, higher-quality alternative to the reference Qwen3-0.6B when you have
# the memory for it (~8 GB at Q8_0). No reasoning channel: Mistral answers
# directly, so there are no thinking tags to configure.

workspace:
  name: mistral-7b

  models:
    - id: llm
      name: bartowski/Mistral-7B-Instruct-v0.3-GGUF
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: Mistral-7B-Instruct-v0.3-Q8_0.gguf
        n_ctx: 4096
        n_batch: 4096
        n_ubatch: 4096
        n_seq_max: 4
        n_gpu_layers: 999
        flash_attn_type: AUTO

  pipelines:
    - id: agent
      name: Mistral-7B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            tags:
              tool_open: "[TOOL_CALLS]"
              tool_close: "</s>"
