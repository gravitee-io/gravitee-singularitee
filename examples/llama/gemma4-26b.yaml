# Gemma 4 26B-A4B (QAT) · channel markers
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/llama/gemma4-26b.yaml
#
# One model (id: llm) and one pipeline (id: agent), so the same client config and
# curls work across every example file. Prose, measurements and caveats for this
# model live in docs/models/README.md.
#
# n_ctx is PER SEQUENCE: total KV allocated is n_ctx * n_seq_max.
# MoE (4B active), sliding-window attention, Gemma license. ~23 ms warm TTFT with
# full prefix reuse — SWA decode cost is capped at the window, so speed holds at
# depth. The full-size SWA cache is memory-hungry: 131k OOMs a 36 GB Mac next to
# the weights, 32k fits. Run thinking-OFF — the thinking channel's
# generation-time grammar is unstable.

workspace:
  name: gemma4-26b

  models:
    - id: llm
      name: google/gemma-4-26B-A4B-it-qat-q4_0-gguf
      type: llama_cpp
      memory_check: warn
      llama_cpp:
        path: gemma-4-26B_q4_0-it.gguf
        n_ctx: 32768 # full-size SWA cache: keep the window modest
        n_seq_max: 1
        n_gpu_layers: 999
        flash_attn_type: ENABLED
        cache_type_k: q8_0
        cache_type_v: q8_0
        mtp: false # Gemma 4 MTP uses separate draft GGUFs, not an embedded head

  pipelines:
    - id: agent
      name: Gemma 4 26B Agent Pipeline
      entry: agent
      steps:
        - id: agent
          type: infer
          role: output
          config:
            model_id: llm
            output_field: agent.output
            context:
              enable_thinking: true
            tags:
              reasoning_open: "<|channel>thought"
              reasoning_close: "<channel|>"
              tool_open: "<|tool_call>"
              tool_close: "<tool_call|>"
            tool_extraction_template: gemma-call # built-in
