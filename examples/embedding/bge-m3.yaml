# Text embeddings · BAAI/bge-m3 (ONNX)
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/embedding/bge-m3.yaml
#
# Multilingual (100+ languages), 1024-dim, CLS pooling, L2-normalized, no query
# prefix needed. The pooling/normalize pair MUST match the model card — BGE-M3
# wants CLS + normalize; most sentence-transformers want MEAN.
#
# Embed over HTTP:
#   curl localhost:8080/v1/embeddings -H 'content-type: application/json' \
#     -d '{"model":"text-embedding","input":["bonjour le monde","hello world"]}'
#
# This is the model behind examples/pipelines/embedding-router.yaml.

workspace:
  name: bge-m3

  models:
    - id: text-embedding
      name: BAAI/bge-m3
      type: onnx_embedding
      memory_check: disabled
      onnx_embedding:
        model_path: onnx/model.onnx
        tokenizer_path: tokenizer.json
        config_json_path: config.json
        max_sequence_length: 512
        pooling_mode: CLS
        normalize: true
