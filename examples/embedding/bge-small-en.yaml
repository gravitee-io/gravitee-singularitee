# Text embeddings · BAAI/bge-small-en-v1.5 (ONNX)
#
# Standalone workspace — run it with:
#   ./run-server.sh --workspace examples/embedding/bge-small-en.yaml
#
# English-only, 384-dim, ~130 MB — roughly a tenth of bge-m3's footprint and
# noticeably faster on CPU. Use it when your corpus is English and latency or
# memory matters more than multilingual coverage. Same CLS + normalize contract
# as the rest of the BGE family.

workspace:
  name: bge-small-en

  models:
    - id: text-embedding
      name: BAAI/bge-small-en-v1.5
      type: onnx_embedding
      memory_check: disabled
      onnx_embedding:
        model_path: onnx/model.onnx
        tokenizer_path: tokenizer.json
        config_json_path: config.json
        max_sequence_length: 512
        pooling_mode: CLS
        normalize: true
