openapi: 3.1.0
info:
  title: Singularitee Discovery API
  version: "1.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    Model and pipeline discovery plus the liveness probe of the HTTP API of
    `gravitee-singularitee-http`.

    - `/v1/models` and `/v1/models/{model}` are also served bare (`/models`).
      `/health` has no `/v1` form.
    - Pipelines are listed next to models when `http.expose-pipelines: true`
      (the default), described by their task like any other entry; no entry is
      ever labelled `pipeline`.
    - Entries published with `visible: false` are absent from the listing and
      `404` on the single-entry route.
    - The server is opt-in (`http.enabled: false` by default) and listens on port `8080`.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Models
    description: Model and pipeline discovery.
  - name: Health
    description: Liveness probe.

paths:
  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List models
      description: |
        Lists visible models, then visible pipelines when `http.expose-pipelines`
        is on. `created` is the server start time.
      responses:
        "200":
          description: Model list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/NotReady" }

  /v1/models/{model}:
    get:
      tags: [Models]
      operationId: getModel
      summary: Retrieve a model
      description: |
        Looks the id up in the model registry, then in the pipeline registry when
        `http.expose-pipelines` is on.
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The model or pipeline entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Unknown or hidden id (`code: model_not_found`, `param: model`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503": { $ref: "#/components/responses/NotReady" }

  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Liveness check
      description: |
        Always returns `200 OK`, before authentication and before the readiness
        gate. It says the process is up, not that models are loaded: poll
        `/v1/models` for readiness.
      security: []
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                const: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Opt-in API-key auth (`http.auth.enabled: true`, `http.auth.type: bearer`,
        keys in `http.auth.tokens`). When disabled, requests need no credentials.
        Failures return 401 with `WWW-Authenticate: Bearer` and `code: invalid_api_key`.

  responses:
    Unauthorized:
      description: "Missing or invalid bearer token (`code: invalid_api_key`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotReady:
      description: "Workspace still loading (`type: server_error`, `code: model_not_ready`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, param, code]
          properties:
            message: { type: string }
            type:
              type: string
              enum: [invalid_request_error, internal_error, server_error]
            param:
              type: [string, "null"]
            code:
              type: [string, "null"]
              enum:
                - model_not_found
                - invalid_api_key
                - model_not_ready
                - not_found
                - method_not_allowed
                - internal_error
                - null

    Model:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id: { type: string }
        object: { type: string, const: model }
        created: { type: integer, description: "Server start time, epoch seconds." }
        owned_by: { type: string, const: gravitee }
        type:
          type: string
          description: >-
            Non-standard. The task the entry serves. Pipelines report the task
            declared in the workspace or inherited from the model behind their
            output step. Omitted when the task cannot be determined.
          enum:
            - text-generation
            - text-classification
            - token-classification
            - feature-extraction
            - reranking
        input_modalities:
          type: array
          description: >-
            Non-standard. What the entry accepts as input. Omitted when the entry
            reads text alone. A multimodal model keeps `type: text-generation`;
            this field says what may be attached, not which endpoint to call.
          items:
            type: string
            enum: [text, image, audio]

    ModelList:
      type: object
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Model" }
